name: Relatório diário do funil B2B Expansão

# Seg-sáb a partir das 06:07 de Brasília (09:07 UTC), meta 07:15. Domingo não roda. Na segunda o período é sábado + domingo (ver
# scripts/relatorio-funil-b2b.ts). Gera o PDF e posta no canal do Slack (SLACK_CHANNEL_ID).
#
# O agendamento do GitHub atrasa (às vezes horas) ou pula disparos. Por isso há vários
# horários seguidos e um trava: o agendado só posta se ainda não houve envio hoje.
run-name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && 'Funil B2B (teste)' || 'Funil B2B (envio)' }}

on:
  schedule:
    - cron: "7 9 * * 1-6"
    - cron: "23 9 * * 1-6"
    - cron: "41 9 * * 1-6"
    - cron: "53 9 * * 1-6"
  workflow_dispatch:
    inputs:
      date:
        description: "Dia em que o relatório roda (YYYY-MM-DD). Vazio = hoje (Brasília). O período é o dia anterior (segunda: sáb + dom)."
        required: false
      dry_run:
        description: "Só gera o PDF (sobe como artifact) e NÃO posta no Slack."
        type: boolean
        default: false

# Nunca roda dobrado (evita PDF repetido no canal).
concurrency:
  group: relatorio-funil-b2b
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Já enviou hoje?
        id: trava
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desde=$(date -u -d "$(TZ=America/Sao_Paulo date +%F) 00:00 -0300" +%FT%TZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/relatorio-funil-b2b.yml/runs?created=>=$desde&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.display_title == \"Funil B2B (envio)\") | select(.conclusion == \"success\" or .status != \"completed\")] | length")
          echo "envios hoje: $n"
          if [ "$n" -gt 0 ]; then echo "pular=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.trava.outputs.pular != '1'

      - uses: oven-sh/setup-bun@v2
        if: steps.trava.outputs.pular != '1'
        with:
          bun-version: latest

      - name: Instala dependências
        if: steps.trava.outputs.pular != '1'
        run: bun install --frozen-lockfile

      - name: Instala o Chromium do Playwright
        if: steps.trava.outputs.pular != '1'
        run: bunx playwright install --with-deps chromium

      - name: Gera o relatório
        if: steps.trava.outputs.pular != '1'
        env:
          PIPERUN_API_KEY: ${{ secrets.PIPERUN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=(--out relatorio-funil-b2b.pdf)
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          bun run scripts/relatorio-funil-b2b.ts "${args[@]}"

      - name: Sobe o PDF como artifact (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-funil-b2b
          path: relatorio-funil-b2b.pdf
          if-no-files-found: warn
